name: Android build and tests
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      build-release:
        description: Also validate the minified release APK without publishing
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      build-release:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Validate workflows and delivery scripts
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
          shellcheck scripts/*.sh
          python3 -m py_compile scripts/release_ui_smoke.py scripts/wait_for_android.py
          python3 -m unittest discover -s scripts/tests -v
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Validate delivery tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests, lint and APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Package preview APK
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BUILD_SHA="$(git rev-parse HEAD)"
          python3 scripts/apk_artifact.py package \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --output-metadata app/build/outputs/apk/debug/output-metadata.json \
            --destination artifacts/preview --source-sha "${PR_HEAD_SHA:-$BUILD_SHA}" --build-sha "$BUILD_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/preview/
          if-no-files-found: error
          retention-days: 14
      - name: Build unsigned release for signing job
        if: inputs.build-release
        run: ./gradlew lintRelease assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: inputs.build-release
        with:
          name: android-release-unsigned
          path: app/build/outputs/apk/release/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && inputs.build-release
        with:
          name: android-release-diagnostics
          path: |
            app/build/outputs/mapping/release/
            app/build/reports/lint-results-release.html
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14
  device-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 31, 35, 36, '37.0', '37.2']
        include:
          - api-level: '37.0'
            target: google_apis
            ram-size: 4096M
          - api-level: '37.2'
            target: google_apis_ps16k
            ram-size: 4096M
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        if: inputs.build-release
        with:
          name: android-release-unsigned
          path: release-unsigned
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: ${{ !startsWith(format('{0}', matrix.api-level), '37.') }}
        env:
          RELEASE_APK: ${{ inputs.build-release && 'release-unsigned/app-release-unsigned.apk' || '' }}
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target || 'default' }}
          ram-size: ${{ matrix.ram-size || '2048M' }}
          profile: pixel_6
          disable-animations: true
          script: bash scripts/device_ci.sh
      - name: Android 17 device tests with framework readiness checks
        if: ${{ startsWith(format('{0}', matrix.api-level), '37.') }}
        env:
          DEVICE_API: ${{ matrix.api-level }}
          DEVICE_TARGET: ${{ matrix.target }}
          RELEASE_APK: ${{ inputs.build-release && 'release-unsigned/app-release-unsigned.apk' || '' }}
        run: bash scripts/android17_device_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-tests-api-${{ matrix.api-level }}
          path: |
            screenshots/
            app/build/reports/androidTests/
          retention-days: 14
  ci:
    name: Android CI gate
    needs: [delivery, build, device-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every build and device check
        env:
          BUILD: ${{ needs.build.result }}
          DEVICES: ${{ needs.device-tests.result }}
          DELIVERY: ${{ needs.delivery.result }}
        run: test "$DELIVERY" = success && test "$BUILD" = success && test "$DEVICES" = success
